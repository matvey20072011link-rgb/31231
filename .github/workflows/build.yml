name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Prepare sources and Build
        run: |
          # 1. Если в репозитории лежит ZIP-архив, распаковываем его
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Найден архив $ZIP_FILE, распаковываем..."
            unzip -o "$ZIP_FILE"
          fi

          # 2. Ищем файл settings.gradle
          SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ОШИБКА: Файл settings.gradle не найден ни в репозитории, ни внутри zip!"
            echo "Содержимое репозитория:"
            ls -laR
            exit 1
          fi

          # 3. Переходим в директорию с проектом и собираем
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Проект найден в: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          gradle build --no-daemon

          # 4. Копируем результат для загрузки в артефакты
          mkdir -p "$GITHUB_WORKSPACE/build/libs"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/build/libs/" 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoHealthTag-1.21.4
          path: build/libs/*.jar
