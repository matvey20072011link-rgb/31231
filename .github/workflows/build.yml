name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Locate project and build
        run: |
          # Находим путь к файлу settings.gradle независимо от глубины папок
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle" | head -n 1))
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Ошибка: settings.gradle не найден в репозитории!"
            exit 1
          fi
          
          echo "Сборка проекта в директории: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle build
          
          # Копируем собранный мод в корневой каталог сборщика для сохранения
          mkdir -p $GITHUB_WORKSPACE/build/libs
          cp build/libs/*.jar $GITHUB_WORKSPACE/build/libs/ 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoHealthTag-1.21.4
          path: build/libs/*.jar
